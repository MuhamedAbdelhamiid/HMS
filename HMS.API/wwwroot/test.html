<!DOCTYPE html>
<html>
<head>
    <title>SignalR Test - HMS</title>
    <!-- استدعاء مكتبة SignalR الجاهزة -->
    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.js"></script>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #messages {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            background: #f9f9f9;
        }
    </style>
</head>
<body>

    <h2>HMS SignalR Tester</h2>

    <p>1. هات الـ JWT Token بتاعك من Postman (الـ Admin أو الـ Staff) وحطه هنا:</p>
    <input type="text" id="tokenInput" placeholder="Paste JWT Token here" size="80">
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>

    <div id="messages"></div>

    <script>
        let connection;

        function appendMessage(msg) {
            document.getElementById("messages").innerHTML += "<div>" + msg + "</div>";
        }

        async function connect() {
            const token = document.getElementById("tokenInput").value;
            if (!token) {
                appendMessage("❌ Please enter a JWT token first!");
                return;
            }

            try {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl("https://localhost:7059/service", {
                        accessTokenFactory: () => token
                    })
                    .build();

                // 1. رسايل الأدمنز
                connection.on("NewRequestSent", function (message) {
                    appendMessage("📢 [Admin] New Request: " + JSON.stringify(message));
                });

                // 2. رسايل الـ Staff
                connection.on("NewAssignForStaff", function (message) {
                    appendMessage("👷 [Staff] New Assigned Task: " + JSON.stringify(message));
                });

                // 3. رسايل الـ Guest
                connection.on("UpdateStatusForUser", function (message) {
                    appendMessage("✅ [Guest] Status Updated: " + JSON.stringify(message));
                });

                await connection.start();
                appendMessage("✅ Connected to Hub successfully!");
            } catch (e) {
                appendMessage("❌ Connection Error: " + e);
                console.error(e);
            }
        }

        async function disconnect() {
            if (connection) {
                await connection.stop();
                appendMessage("🔌 Disconnected.");
            }
        }
    </script>
</body>
</html>
